<!DOCTYPE html>
<html lang="{{ site.LanguageCode | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}is-home{{ end }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "brush-defs.html" . }}

  {{ partial "header.html" . }}
  {{ partial "notice.html" . }}

  <main id="main" tabindex="-1">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
</body>
</html>
